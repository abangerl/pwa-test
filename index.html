<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>My PWA</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 32rem;
        margin: 1.5rem;
        padding: 2.5rem;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 3rem #0f172a18;
      }

      h1 { margin-top: 0; }
      p { line-height: 1.6; }

      button {
        box-sizing: border-box;
        width: 100%;
        margin-top: 1rem;
        padding: 0.75rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: white;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #status { min-height: 1.5em; }

      #unsupported {
        font-size: clamp(12rem, 45vw, 32rem);
        font-weight: 900;
        line-height: 0.8;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>My PWA</h1>
      <p>Get a daily reminder at midnight UTC.</p>
      <p>Reminders are best-effort and may stop if you do not open the app or tap a notification.</p>
      <button id="enable-button" type="button">Enable daily reminder</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <div id="unsupported" role="img" aria-label="Unsupported" hidden>!?</div>
    <script>
      const app = document.querySelector("#app");
      const unsupported = document.querySelector("#unsupported");
      const enableButton = document.querySelector("#enable-button");
      const status = document.querySelector("#status");
      const supported =
        window.isSecureContext &&
        "serviceWorker" in navigator &&
        "Notification" in window &&
        typeof window.TimestampTrigger === "function";

      if (!supported) {
        app.hidden = true;
        unsupported.hidden = false;
      } else {
        unsupported.hidden = true;

        const scheduleNextMidnight = async (registration) => {
          if (!registration.active) {
            throw new Error("The service worker is not active yet. Try again shortly.");
          }

          const channel = new MessageChannel();
          const response = new Promise((resolve, reject) => {
            channel.port1.onmessage = ({ data }) => {
              channel.port1.close();
              if (data.ok) {
                resolve(data);
              } else {
                reject(new Error(data.error));
              }
            };
            channel.port1.onmessageerror = () => {
              channel.port1.close();
              reject(new Error("Could not read the service worker response."));
            };
          });
          registration.active.postMessage(
            { type: "schedule-midnight" },
            [channel.port2]
          );
          const result = await response;
          return result.readableTime;
        };

        const registrationPromise = navigator.serviceWorker
          .register("./service-worker.js")
          .then(() => navigator.serviceWorker.ready);

        navigator.serviceWorker.addEventListener("message", ({ data }) => {
          if (data?.type === "reminder-scheduling-error") {
            status.textContent = data.error;
          }
        });

        registrationPromise.then(async (registration) => {
          if (Notification.permission === "granted") {
            const readableTime = await scheduleNextMidnight(registration);
            status.textContent = `Next reminder: ${readableTime}.`;
          } else {
            status.textContent = "Enable notifications to schedule the reminder.";
          }
        }).catch((error) => {
          status.textContent = error instanceof Error
            ? error.message
            : "Could not prepare the reminder.";
        });

        enableButton.addEventListener("click", async () => {
          enableButton.disabled = true;
          status.textContent = "Enabling daily reminder…";

          try {
            if (Notification.permission !== "granted") {
              const permission = await Notification.requestPermission();
              if (permission !== "granted") {
                throw new Error("Notification permission was not granted.");
              }
            }

            const registration = await registrationPromise;
            const readableTime = await scheduleNextMidnight(registration);
            status.textContent = `Next reminder: ${readableTime}.`;
          } catch (error) {
            status.textContent = error instanceof Error
              ? error.message
              : "Could not schedule the reminder.";
          } finally {
            enableButton.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
