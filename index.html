<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>My PWA</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 32rem;
        margin: 1.5rem;
        padding: 2.5rem;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 3rem #0f172a18;
      }

      h1 { margin-top: 0; }
      p { line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>My PWA</h1>
      <p>A minimal progressive web app, ready to install and available offline.</p>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js");
        });
      }
    </script>
  </body>
</html>
