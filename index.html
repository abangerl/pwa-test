<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>My PWA</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 32rem;
        margin: 1.5rem;
        padding: 2.5rem;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 3rem #0f172a18;
      }

      h1 { margin-top: 0; }
      p { line-height: 1.6; }

      form {
        display: grid;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      input, button {
        box-sizing: border-box;
        width: 100%;
        padding: 0.75rem;
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <h1>My PWA</h1>
      <p>Schedule a local reminder on a browser that supports notification triggers.</p>
      <form id="reminder-form">
        <label for="reminder-time">Reminder date and time</label>
        <input id="reminder-time" name="reminder-time" type="datetime-local" required>
        <button id="schedule-button" type="submit">Schedule reminder</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const form = document.querySelector("#reminder-form");
      const timeInput = document.querySelector("#reminder-time");
      const scheduleButton = document.querySelector("#schedule-button");
      const status = document.querySelector("#status");
      const supported =
        "serviceWorker" in navigator &&
        window.isSecureContext &&
        "Notification" in window &&
        typeof window.TimestampTrigger === "function";

      const toLocalDateTime = (date) => {
        const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60_000);
        return localDate.toISOString().slice(0, 16);
      };

      timeInput.min = toLocalDateTime(new Date());

      let registrationPromise;
      if ("serviceWorker" in navigator) {
        registrationPromise = navigator.serviceWorker
          .register("./service-worker.js")
          .then(() => navigator.serviceWorker.ready);
        registrationPromise.catch(() => {
          status.textContent = "Could not register the service worker.";
        });
      }

      if (!supported) {
        scheduleButton.disabled = true;
        status.textContent =
          "Scheduled reminders are not supported by this browser. No reminder was scheduled.";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const scheduledAt = new Date(timeInput.value).getTime();

        if (!Number.isFinite(scheduledAt) || scheduledAt <= Date.now()) {
          status.textContent = "Choose a date and time in the future.";
          return;
        }

        scheduleButton.disabled = true;
        status.textContent = "Scheduling reminder…";

        try {
          if (!supported) {
            throw new Error("Scheduled reminders are not supported by this browser.");
          }

          if (Notification.permission !== "granted") {
            const permission = await Notification.requestPermission();
            if (permission !== "granted") {
              throw new Error("Notification permission was not granted.");
            }
          }

          const registration = await registrationPromise;
          if (!registration.active) {
            throw new Error("The service worker is not active yet. Try again shortly.");
          }

          const readableTime = new Date(scheduledAt).toLocaleString(undefined, {
            dateStyle: "medium",
            timeStyle: "short"
          });
          const channel = new MessageChannel();
          const response = new Promise((resolve, reject) => {
            channel.port1.onmessage = ({ data }) => {
              channel.port1.close();
              if (data.ok) {
                resolve(data);
              } else {
                reject(new Error(data.error));
              }
            };
            channel.port1.onmessageerror = () => {
              channel.port1.close();
              reject(new Error("Could not read the service worker response."));
            };
          });

          registration.active.postMessage(
            { type: "schedule-reminder", scheduledAt, readableTime },
            [channel.port2]
          );
          await response;
          status.textContent = `Reminder scheduled for ${readableTime}.`;
        } catch (error) {
          status.textContent = error instanceof Error
            ? error.message
            : "Could not schedule the reminder.";
        } finally {
          scheduleButton.disabled = !supported;
        }
      });
    </script>
  </body>
</html>
